---
- name: Make $host_user root
  ansible.builtin.user:
    name: "{{ common_user }}"
    groups: sudo
    append: true
  tags:
    - common_setup

- name: Add .bash_aliases
  ansible.builtin.template:
    src: aliases.j2
    dest: "{{ common_bash_aliases_path }}"
    owner: "{{ common_user }}"
    group: "{{ common_user }}"
    mode: "0644"
  tags:
    - common_setup

- name: Add custom aliases
  ansible.builtin.blockinfile:
    path: "{{ common_bash_aliases_path }}"
    block: |-
      {{ common_extra_bash_aliases }}
    marker: "# {mark} Ansible(smoothie.common): Add custom aliases"
  register: common_custom_alias_changes
  changed_when: common_custom_alias_changes.changed
  when: >
    common_extra_bash_aliases | default(false)
  tags:
    - common_setup

- name: Install common packages
  ansible.builtin.apt:
    name: "{{ common_packages | join(',') }}"
    state: present
  tags:
    - common_setup

- name: Keep bash_completion when suing
  ansible.builtin.blockinfile:
    path: /root/.bashrc
    block: |
      if [ -f /etc/bash_completion ] && ! shopt -oq posix; then
          . /etc/bash_completion
      fi
    marker: "# {mark} Ansible(smoothie.common): Keep bash_completion when suing"
  tags:
    - common_setup

- name: Check for existent symlink sources
  ansible.builtin.stat:
    path: "{{ item.source }}"
  loop: "{{ common_apply_symlinks | default([], true) }}"
  register: common_check_common_existent_symlink_resources
  tags:
    - common_setup

- name: Apply symlinks
  ansible.builtin.file:
    src: "{{ item.item.source }}"
    dest: "{{ item.item.target }}"
    state: link
  loop: "{{ common_check_common_existent_symlink_resources.results | default([], true) }}"
  loop_control:
    label: >-
      source: {{ item.item.source | default('none', true) }},
      target: {{ item.item.target | default('none', true) }}
  when: >
    item.stat.exists | default(false)
  tags:
    - common_setup

- name: Create service units
  ansible.builtin.template:
    src: unit.service.j2
    dest: "{{ common_systemd_service_path }}{{ item.name }}"
    user: root
    group: root
    mode: "0644"
  loop: "{{ common_systemd_units | default([], true) }}"
  loop_control:
    label: "{{ common_systemd_service_path + item.name | default('none', true) }}"
  when: >
    common_systemd_units is defined | default(false)
  tags:
    - common_setup

- name: Reload service daemon
  ansible.builtin.systemd:
    daemon_reload: true
  when: >
    common_systemd_units is defined | default(false)
  tags:
    - common_setup

- name: Start and enable service units
  ansible.builtin.systemd:
    enabled: true
    name: "{{ item.name }}"
    state: started
    no_block: true
  loop: "{{ common_systemd_units | default([], true) }}"
  loop_control:
    label: "{{ common_systemd_service_path + item.name | default('none', true) }}"
  when: >
    common_systemd_units is defined | default(false)
  tags:
    - common_setup
