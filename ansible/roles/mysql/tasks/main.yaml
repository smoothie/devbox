---
- name: Install PyMySQL via pip
  ansible.builtin.pip:
    name: PyMySQL
    umask: "0022"
  tags:
    - mysql_setup

- name: Install MySQL packages
  ansible.builtin.apt:
    name: "{{ mysql_packages }}"
    state: present
  tags:
    - mysql_setup

- name: Start MySQL service
  ansible.builtin.service:
    name: mysql
    state: started
    enabled: true
  tags:
    - mysql_setup

- name: Set root PW
  community.mysql.mysql_user:
    name: "{{ mysql_root_user }}"
    password: "{{ mysql_root_password }}"
    login_user: "{{ mysql_root_user }}"
    login_password: ""
    login_unix_socket: "{{ mysql_unix_socket }}"
    state: present
  tags:
    - mysql_setup

- name: Replace users my.cnf
  ansible.builtin.template:
    src: user.cnf.j2
    dest: "{{ item.value.path }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ mysql_users | dict2items | selectattr('value.path') | list }}"
  no_log: true
  tags:
    - mysql_setup

- name: Replace mysqld.cnf
  ansible.builtin.template:
    src: mysqld.cnf.j2
    dest: "{{ mysql_paths.mysqld_config }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart MySQL service
  tags:
    - mysql_setup

- name: Create privileged DB users
  community.mysql.mysql_user:
    host: "%"
    name: "{{ item.key }}"
    password: "{{ item.value.password }}"
    priv: "{{ item.value.privileges }}"
    state: present
  loop: "{{ mysql_users | dict2items | selectattr('value.privileges', 'defined') | list }}"
  no_log: true
  tags:
    - mysql_setup

- name: Create $mysql_databases
  community.mysql.mysql_db:
    name: "{{ mysql_databases }}"
    state: present
    login_unix_socket: "{{ mysql_unix_socket }}"
  when:
    - mysql_databases is defined
  tags:
    - mysql_setup
