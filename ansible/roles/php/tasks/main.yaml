---
- name: Include supporting tasks
  ansible.builtin.include_tasks: shared.yaml
  tags:
    - php_setup

- name: Validate PHP repository distribution
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'Ubuntu'
      - ansible_facts.distribution_release in ['jammy', 'noble']
    fail_msg: The PHP PPA supports Jammy and Noble; newer Ubuntu releases require a reviewed Sury migration.
  tags:
    - php_setup

- name: Install PHP repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - python3-apt
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags:
    - php_setup

- name: Create APT keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  tags:
    - php_setup

- name: Install reviewed PHP PPA repository key
  ansible.builtin.copy:
    src: ondrej-php.asc
    dest: /etc/apt/keyrings/devbox-php.asc
    mode: "0644"
  tags:
    - php_setup

- name: Remove legacy unscoped PHP repository entries
  ansible.builtin.apt_repository:
    repo: deb https://ppa.launchpadcontent.net/ondrej/php/ubuntu {{ item }} main
    state: absent
    update_cache: false
  loop:
    - jammy
    - noble
  tags:
    - php_setup

- name: Remove legacy globally trusted PHP key
  ansible.builtin.file:
    path: /etc/apt/trusted.gpg.d/php.asc
    state: absent
  tags:
    - php_setup

- name: Setup distribution-matched PHP PPA
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/devbox-php.asc]
      https://ppa.launchpadcontent.net/ondrej/php/ubuntu {{ ansible_facts.distribution_release }} main
    filename: devbox-php
    update_cache: true
  tags:
    - php_setup

- name: Install PHP versions and packages
  ansible.builtin.apt:
    name: "{{ php_packages[item] }}"
    state: present
  loop: "{{ php_versions }}"
  loop_control:
    label: php{{ item }}
  tags:
    - php_setup

- name: Update PHP-CLI configuration
  ansible.builtin.lineinfile:
    path: /etc/php/{{ item.0.key }}/cli/php.ini
    regexp: "{{ item.1.regexp }}"
    line: "{{ item.1.line }}"
  with_subelements:
    - "{{ php_ini_changes | dict2items | selectattr('key', 'in', php_versions) | list }}"
    - value
  tags:
    - php_setup

- name: Update PHP-FPM configuration
  ansible.builtin.lineinfile:
    path: /etc/php/{{ item.0.key }}/fpm/php.ini
    regexp: "{{ item.1.regexp }}"
    line: "{{ item.1.line }}"
  with_subelements:
    - "{{ php_ini_changes | dict2items | selectattr('key', 'in', php_versions) | list }}"
    - value
  notify: Restart PHP-FPM service
  tags:
    - php_setup

- name: Update PHP XDebug config
  ansible.builtin.template:
    src: "{{ item }}/mods-available/xdebug.ini.j2"
    dest: /etc/php/{{ item }}/mods-available/xdebug.ini
    owner: root
    group: root
    mode: "0644"
  loop: "{{ php_versions }}"
  loop_control:
    label: php{{ item }}
  notify: Restart PHP-FPM service
  tags:
    - php_setup

- name: Replace PHP-FPM pools
  ansible.builtin.template:
    src: "{{ item }}/fpm/pool.d/www.conf.j2"
    dest: /etc/php/{{ item }}/fpm/pool.d/www.conf
    owner: root
    group: root
    mode: "0644"
  loop: "{{ php_versions }}"
  loop_control:
    label: php{{ item }}
  notify: Restart PHP-FPM service
  tags:
    - php_setup

- name: Gather PHP-FPM service facts
  ansible.builtin.service_facts:
  tags:
    - php_setup

- name: Set installed PHP-FPM services
  ansible.builtin.set_fact:
    php_installed_fpm_services: >-
      {{ ansible_facts.services | dict2items
        | selectattr('key', 'match', '^php[0-9.]+-fpm([.]service)?$') | list }}
    php_active_fpm_services: >-
      {{ php_versions | map('regex_replace', '^', 'php') | map('regex_replace', '$', '-fpm') | list }}
  tags:
    - php_setup

- name: Stop inactive PHP-FPM services
  ansible.builtin.service:
    name: "{{ item.key | regex_replace('[.]service$', '') }}"
    state: stopped
    enabled: false
  loop: "{{ php_installed_fpm_services }}"
  when: (item.key | regex_replace('[.]service$', '')) not in php_active_fpm_services
  tags:
    - php_setup

- name: Enable active PHP-FPM services
  ansible.builtin.service:
    name: php{{ item }}-fpm
    state: started
    enabled: true
  loop: "{{ php_versions }}"
  tags:
    - php_setup
