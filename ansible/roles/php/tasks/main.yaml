---
- name: Include supporting tasks
  ansible.builtin.include_tasks: shared.yaml
  tags:
    - php_setup

- name: Validate PHP repository distribution
  ansible.builtin.assert:
    that:
      - ansible_distribution == 'Ubuntu'
      - ansible_distribution_release in ['jammy', 'noble']
    fail_msg: The PHP PPA supports Jammy and Noble; newer Ubuntu releases require a reviewed Sury migration.
  tags:
    - php_setup

- name: Create APT keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  tags:
    - php_setup

- name: Add PHP PPA repository key
  ansible.builtin.get_url:
    url: >-
      https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xB8DC7E53946656EFBCE4C1DD71DAEAAB4AD4CAB6
    dest: /etc/apt/keyrings/devbox-php.asc
    checksum: sha256:1bed18eabeccc647b731492b1fbfcb1a916dc03d63557dc7e2c1007e79901a71
    mode: "0644"
  tags:
    - php_setup

- name: Remove legacy unscoped PHP repository entries
  ansible.builtin.apt_repository:
    repo: deb https://ppa.launchpadcontent.net/ondrej/php/ubuntu {{ item }} main
    state: absent
    update_cache: false
  loop:
    - jammy
    - noble
  tags:
    - php_setup

- name: Remove legacy globally trusted PHP key
  ansible.builtin.file:
    path: /etc/apt/trusted.gpg.d/php.asc
    state: absent
  tags:
    - php_setup

- name: Setup distribution-matched PHP PPA
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/devbox-php.asc]
      https://ppa.launchpadcontent.net/ondrej/php/ubuntu {{ ansible_distribution_release }} main
    filename: devbox-php
    update_cache: true
  tags:
    - php_setup

- name: Install PHP versions and packages
  ansible.builtin.apt:
    name: "{{ php_packages[item] }}"
    state: present
  loop: "{{ php_versions }}"
  loop_control:
    label: php{{ item }}
  tags:
    - php_setup

- name: Show PHP packages which should be enabled
  ansible.builtin.debug:
    msg: phpenmod -v {{ item }} {{ php_packages[item] | select('search', '.*-.*') | join(' ') }}
  loop: "{{ php_versions }}"
  tags:
    - php_setup

- name: Enable PHP packages
  ansible.builtin.command: phpenmod -v {{ item }} {{ php_packages[item] | select('search', '.*-.*') | join(' ') }}
  loop: "{{ php_versions }}"
  loop_control:
    label: php{{ item }}
  register: php_packages_have_been_enabled
  changed_when: php_packages_have_been_enabled.rc != 0
  tags:
    - php_setup

- name: Update PHP-CLI configuration
  ansible.builtin.lineinfile:
    path: /etc/php/{{ item.0.key }}/cli/php.ini
    regexp: "{{ item.1.regexp }}"
    line: "{{ item.1.line }}"
  with_subelements:
    - "{{ php_ini_changes | dict2items | selectattr('key', 'in', php_versions) | list }}"
    - value
  tags:
    - php_setup

- name: Update PHP-FPM configuration
  ansible.builtin.lineinfile:
    path: /etc/php/{{ item.0.key }}/fpm/php.ini
    regexp: "{{ item.1.regexp }}"
    line: "{{ item.1.line }}"
  with_subelements:
    - "{{ php_ini_changes | dict2items | selectattr('key', 'in', php_versions) | list }}"
    - value
  notify: Restart PHP-FPM service
  tags:
    - php_setup

- name: Update PHP XDebug config
  ansible.builtin.template:
    src: "{{ item }}/mods-available/xdebug.ini.j2"
    dest: /etc/php/{{ item }}/mods-available/xdebug.ini
    owner: root
    group: root
    mode: "0644"
  loop: "{{ php_versions }}"
  loop_control:
    label: php{{ item }}
  notify: Restart PHP-FPM service
  tags:
    - php_setup

- name: Replace PHP-FPM pools
  ansible.builtin.template:
    src: "{{ item }}/fpm/pool.d/www.conf.j2"
    dest: /etc/php/{{ item }}/fpm/pool.d/www.conf
    owner: root
    group: root
    mode: "0644"
  loop: "{{ php_versions }}"
  loop_control:
    label: php{{ item }}
  notify: Restart PHP-FPM service
  tags:
    - php_setup

- name: Gather PHP-FPM service facts
  ansible.builtin.service_facts:
  tags:
    - php_setup

- name: Set installed PHP-FPM services
  ansible.builtin.set_fact:
    php_installed_fpm_services: >-
      {{ services | dict2items | selectattr('key', 'match', '^php[0-9.]+-fpm(\\.service)$') | items2dict }}
  tags:
    - php_setup

- name: Set active PHP-FPM services
  ansible.builtin.set_fact:
    php_active_fpm_services: "{{ php_versions | map('regex_replace', '^(.*)$', 'php\\1-fpm.service') | list }}"
  tags:
    - php_setup

- name: Show inactive PHP-FPM services
  ansible.builtin.debug:
    msg: >-
      {{ php_installed_fpm_services
        | dict2items
        | rejectattr('key', 'in', php_active_fpm_services)
        | map(attribute='key')
        | list }}
  tags:
    - php_setup

- name: Show inactive PHP-FPM which should be disabled
  ansible.builtin.debug:
    msg: >-
      {{ php_installed_fpm_services
        | dict2items
        | selectattr('value.status', 'eq', 'enabled')
        | rejectattr('key', 'in', php_active_fpm_services)
        | map(attribute='key')
        | list }}
  tags:
    - php_setup

- name: Stop inactive PHP-FPM services
  ansible.builtin.service:
    name: "{{ item.key }}"
    state: stopped
    enabled: false
  loop: >-
    {{ php_installed_fpm_services
      | dict2items
      | selectattr('value.status', 'eq', 'enabled')
      | rejectattr('key', 'in', php_active_fpm_services)
      | list }}
  tags:
    - php_setup

- name: Show active PHP-FPM services
  ansible.builtin.debug:
    var: php_active_fpm_services
  tags:
    - php_setup

- name: Show active PHP-FPM services which should be enabled
  ansible.builtin.debug:
    msg: >-
      {{ php_installed_fpm_services
        | dict2items
        | selectattr('value.status', 'ne', 'enabled')
        | selectattr('key', 'in', php_active_fpm_services)
        | map(attribute='key')
        | list }}
  tags:
    - php_setup

- name: Enable active PHP-FPM services
  ansible.builtin.service:
    name: "{{ item.key }}"
    state: started
    enabled: true
  loop: >-
    {{ php_installed_fpm_services
      | dict2items
      | selectattr('value.status', 'ne', 'enabled')
      | selectattr('key', 'in', php_active_fpm_services)
      | list }}
  tags:
    - php_setup
