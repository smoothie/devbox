---
name: CI
"on":
  pull_request:
  push:

jobs:
  check-ansible:
    name: Ansible
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout the codebase.
        uses: actions/checkout@v4
      - name: Run the same fresh-image gates as local development
        run: make check-ci
